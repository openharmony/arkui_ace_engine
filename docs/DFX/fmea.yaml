- 触发条件: UIExtension嵌套使用
  故障模式: UIExtension嵌套超3层
  故障影响: 可能影响性能，卡顿
  故障原因: 应用开发者使用不当
  严酷度: 提示
  恢复措施: 上报大数据
  关键日志: 不涉及
  大数据打点事件: COMPONENT_EXCEPTION

- 触发条件: 节点树遍历中移除子节点
  故障模式: 遍历期间移除子节点
  故障影响: 可能导致cpp_crash
  故障原因: 在子节点遍历过程中执行移除操作，破坏遍历状态
  严酷度: 严重
  恢复措施: 输出LOGF_ABORT，第一现场崩溃
  关键日志: "Try to remove the child([%{public}s][%{public}d]) of "
  大数据打点事件: 不涉及

- 触发条件: FrameProxy子节点重置
  故障模式: 使用中重置子节点
  故障影响: 可能导致UAF问题cpp_crash
  故障原因: FrameProxy在子节点仍在使用时执行ResetChildren操作
  严酷度: 严重
  恢复措施: 输出LOGF_ABORT，第一现场崩溃
  关键日志: "[%{public}d:%{public}s] reset children while in use"
  大数据打点事件: 不涉及

- 触发条件: Pattern分离期间访问Host
  故障模式: 分离期间访问宿主FrameNode
  故障影响: 可能导致UAF问题cpp_crash
  故障原因: Pattern在OnDetachFromMainTree期间仍尝试通过GetHost访问宿主节点
  严酷度: 严重
  恢复措施: 输出LOGF_ABORT，第一现场崩溃
  关键日志: "fatal: can't GetHost at detaching period"
  大数据打点事件: 不涉及

- 触发条件: C API回调线程安全
  故障模式: 帧回调/空闲回调在非UI线程调用
  故障影响: 可能导致cpp_crash
  故障原因: OH_ArkUI_PostFrameCallback或OH_ArkUI_PostIdleCallback在非UI线程执行
  严酷度: 严重
  恢复措施: 输出LOGF_ABORT，第一现场崩溃
  关键日志: "OH_ArkUI_PostFrameCallback doesn't run on UI thread!" / "OH_ArkUI_PostIdleCallback doesn't run on UI thread!"
  大数据打点事件: 不涉及
