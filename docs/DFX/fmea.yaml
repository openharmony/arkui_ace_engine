# ArkUI FMEA 知识库
# 本文件覆盖领域 = ArkUI。读取方：odk-design skill 按 SKILL.md 的领域匹配规则读取对应文件。
# 分析对象由设计技能根据业务流程中实际导致触发条件的对象填写，不在此预设。

- 触发条件: UIExtension组件使用
  故障模式: UIExtension循环嵌套
  故障影响: IPC通信时可能导致appfreeze
  故障原因: UIExtension循环嵌套
  严酷度: 严重
  恢复措施: DFX系统回收应用进程；通过FireOnErrorCallback回调ERROR_CODE_UIEXTENSION_FORBID_CASCADE拦截
  关键日志: "Prohibit nesting uiExtensionComponent"
  大数据打点事件: 不涉及

- 触发条件: 跨线程UI任务调度
  故障模式: UI任务多线程检查
  故障影响: UI任务不允许在非主线程执行
  故障原因: UI任务误用在非主线程执行
  严酷度: 严重
  恢复措施: 可以通过系统参数开启该检查第一时间拦截问题
  关键日志: "CheckThread fail: expected [%{public}s]"
  大数据打点事件: 不涉及

- 触发条件: OS回调应用代码
  故障模式: 底座回调应用代码时候，触发应用回调内部的稳定性问题
  故障影响: 应用crash
  故障原因: 应用内部回调逻辑异常
  严酷度: 严重
  恢复措施: 无
  关键日志: "[%{public}s] crash occured on callback: %{public}"
  大数据打点事件: 不涉及

- 触发条件: 主线程消息处理
  故障模式: FA模型应用主线程无响应
  故障影响: APP Freeze
  故障原因: 主线程过度繁忙，无法及时响应后续任务
  严酷度: 严重
  恢复措施: DFX系统回收应用进程，输出堆栈
  关键日志: app-freeze
  大数据打点事件: UI_BLOCK_6S

- 触发条件: 节点树遍历
  故障模式: 节点上树成环
  故障影响: 触发遍历时成环，无限递归导致爆栈可能导致cpp_crash
  故障原因: 递归遍历无限循环
  严酷度: 严重
  恢复措施: 给开发者提供开关遍历测试中检测修复；崩溃时有堆栈和Fatal日志
  关键日志: "LoopDetected: child[%{public}.*s] vs current[%{public}.*s]"
  大数据打点事件: 不涉及

- 触发条件: 节点树挂载操作
  故障模式: 一个子结点挂给多个父节点
  故障影响: 可能导致cpp_crash，显示异常，事件处理异常
  故障原因: 节点多挂
  严酷度: 严重
  恢复措施: 给开发者提供开关遍历测试中检测修复；崩溃时有堆栈和Fatal日志
  关键日志: 不涉及
  大数据打点事件: 不涉及

- 触发条件: ArkUI对象生命周期管理
  故障模式: 使用中的对象非法销毁检查
  故障影响: 可能导致cpp_crash
  故障原因: RefPtr智能指针在被使用时，如果被重新赋值将可能导致所管理的对象被析构失效，进而造成UAF问题
  严酷度: 严重
  恢复措施: 识别是不是有对象使用中被销毁的问题，避免程序带着问题继续运行进而出现难以定位的问题现场
  关键日志: "this object is still in use"
  大数据打点事件: 不涉及

- 触发条件: ArkUI引用计数管理
  故障模式: 死亡对象非法Claim
  故障影响: 可能导致cpp_crash
  故障原因: 当对象的强引用计数为0时将触发对象析构，此时对象处于即将死亡状态，不能再通过Claim操作增加对象强引用计数，否则将获得野指针导致UAF问题
  严酷度: 严重
  恢复措施: 通过在Claim操作时检测对象的强引用计数是否为0，让非法Claim操作在第一现场暴露
  关键日志: "invalid claim: refCount=%{public}d, isNewOrRecycle=%{public}d"
  大数据打点事件: 不涉及

- 触发条件: ArkUI类型转换操作
  故障模式: UI对象类型转换错误
  故障影响: 类型转换时C++编译器不能在编译期进行检查，需要开发者在运行期使用IsXxx方法检查JS对象类型，确保类型转换的安全
  故障原因: 类型转换错误
  严酷度: 严重
  恢复措施: 通过开关开启主动检查，提前拦截问题
  关键日志: "bad type conversion"
  大数据打点事件: 不涉及

- 触发条件: ArkUI类型转换操作
  故障模式: JsiType类型转换错误
  故障影响: JSI层类型转换错误可能导致cpp_crash
  故障原因: JsiType转换时目标类型与实际类型不匹配
  严酷度: 严重
  恢复措施: 通过开关开启主动检查，提前拦截问题
  关键日志: "bad cast to "
  大数据打点事件: 不涉及

- 触发条件: ArkUI弱指针访问
  故障模式: WeakPtr裸指针使用
  故障影响: UAF问题 cppcrash
  故障原因: 内部业务通过WeakPtr获取已销毁对象的裸指针使用，WeakPtr的Upgrade应先于裸指针访问
  严酷度: 严重
  恢复措施: 排查代码中直接使用WeakPtr裸指针的地方并整改为安全的Upgrade方法
  关键日志: 不涉及
  大数据打点事件: 不涉及

- 触发条件: 命令式API调用
  故障模式: 命令式节点相关接口使用错误
  故障影响: 应用crash
  故障原因: 命令式节点接口使用错误
  严酷度: 严重
  恢复措施: 输出LOG_FATAL并cppcrash，第一时间告知开发者使用错误
  关键日志: "AddCustomProperty input params name or value is nullptr" / "RemoveCustomProperty input params name is nullptr"
  大数据打点事件: 不涉及

- 触发条件: 渲染树节点访问
  故障模式: 访问已释放的渲染结点
  故障影响: 可能导致cpp_crash
  故障原因: 系统内部故障
  严酷度: 严重
  恢复措施: 通过FREE_NODE_CHECK宏在非UI线程访问free节点时自动重定向到线程安全的MultiThread变体
  关键日志: 不涉及
  大数据打点事件: 不涉及

- 触发条件: 应用响应时延检测
  故障模式: 应用响应完成时延超长
  故障影响: 用户感觉卡顿
  故障原因: 应用业务逻辑过于复杂
  严酷度: 提示
  恢复措施: 通过大数据上报性能雷达
  关键日志: 性能雷达收集事件反馈在大数据网站
  大数据打点事件: INTERACTION_COMPLETED_LATENCY

- 触发条件: 应用帧率检测
  故障模式: 应用连续丢帧达6帧
  故障影响: 用户感觉卡顿
  故障原因: 应用业务逻辑过于复杂
  严酷度: 提示
  恢复措施: 通过大数据上报性能雷达
  关键日志: 性能雷达收集事件反馈在大数据网站
  大数据打点事件: JANK_STATS_APP

- 触发条件: VSync信号等待
  故障模式: Vsync请求500ms/3s未被响应
  故障影响: 卡顿无响应
  故障原因: 图形侧未响应Vsync请求
  严酷度: 一般
  恢复措施: 500ms强制恢复，3s输出关键日志
  关键日志: "ArkUI request vsync, but no vsync received in 500ms\nArkUI request vsync,but no vsync received in 3 seconds\nArkUI force flush vsync for recover pipelinecontext."
  大数据打点事件: 是

- 触发条件: 控件树构建
  故障模式: 控件树过于复杂（节点树过3000，过深500）
  故障影响: 页面加载切换卡顿
  故障原因: 应用控件树过于复杂
  严酷度: 一般
  恢复措施: 报点+性能雷达收集
  关键日志: "PAGE_DEPTH_OVERFLOW\nPAGE_NODE_OVERFLOW"
  大数据打点事件: 是

- 触发条件: 生命周期回调执行
  故障模式: 生命周期函数执行超长
  故障影响: 页面加载切换卡顿
  故障原因: 生命周期回调函数执行超长
  严酷度: 一般
  恢复措施: 报点+性能雷达收集
  关键日志: 不涉及
  大数据打点事件: UI_LIFECIRCLE_FUNCTION_TIMEOUT

- 触发条件: 页面路由加载
  故障模式: 新页面加载完成时延过长
  故障影响: 页面加载切换卡顿
  故障原因: 应用问题、网络波动等因素
  严酷度: 一般
  恢复措施: 报点+性能雷达收集
  关键日志: 不涉及
  大数据打点事件: FRAMEWORK_PAGE_ROUTER_EXCEPTION

- 触发条件: UIExtension透明窗口
  故障模式: 系统弹窗拉起全屏UIExtensionAbility内部无可见结点
  故障影响: 可能导致透明窗口霸屏无法操作
  故障原因: 系统弹窗提供方业务故障
  严酷度: 严重
  恢复措施: 上报大数据，并通过onError通知大桌面处理，销毁该控件，避免霸屏
  关键日志: "transparent node detected"
  大数据打点事件: UIEXTENSION_TRANSPARENT_DETECTED

- 触发条件: 用户交互操作
  故障模式: 交互操作类错误
  故障影响: 通用交互类异常，可能会导致手势响应异常或者焦点不刷新
  故障原因: 多模输入报点异常
  严酷度: 一般
  恢复措施: 上报大数据
  关键日志: 不涉及
  大数据打点事件: GENERAL_INTERACTION_ERROR

- 触发条件: 手势事件处理
